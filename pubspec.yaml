name: playvo
description: Playvo - book sports venues near you.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  geolocator: ^13.0.4
  latlong2: ^0.9.1
  flutter_map: ^7.0.2
  share_plus: ^10.1.2

  # Localization (Guidelines 4.1 / 5.3 - .arb files)
  intl: ^0.20.2



  # Networking (Guidelines 2.2 - unified API response contract)
  http: ^1.2.2

  # Storage
  shared_preferences: ^2.3.2      # language preference only (non-sensitive)
  flutter_secure_storage: ^9.2.2  # Sanctum token (Guidelines 2.4 - never in plain storage)

  # UI
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/playvo_mark.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/playvo_mark.png"

flutter:
  uses-material-design: true

  # Required for `flutter gen-l10n` to run automatically on build.
  generate: true

  assets:
    - assets/logo/
    - assets/venues/
    - assets/illustrations/

  # Cairo is loaded at runtime by google_fonts. To make the first launch work
  # offline, download the Cairo .ttf weights (400/500/600/700) into
  # assets/fonts/ and declare them here as a `fonts:` block.
